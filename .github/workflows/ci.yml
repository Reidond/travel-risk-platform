# Quality gates. Runs on every pull request, and is reused as the pre-deploy
# gate by deploy.yml (workflow_call). One job per tool so checks parallelize.
#
# NOTE: when called via workflow_call, the `github` context is the caller's
# (event_name == "push", workflow == "Deploy"/"Publish to PyPI") — keep that
# in mind before keying anything else on it. github.workflow is deliberately
# part of the concurrency group: deploy.yml and publish-pypi.yml both call
# this workflow on every push to main, and without it one caller's CI would
# queue behind (or cancel) the other's.
name: CI

on:
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Locked ruff from the workspace dev group; each package resolves its
      # own [tool.ruff] config (backend ignores RUF001-003 for Ukrainian text).
      - run: uv run --project core ruff check core backend
      - run: uv run --project core ruff format --check core backend

  pytest-core:
    name: pytest (core, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # core ships to PyPI for 3.12 + 3.13 (see core/pyproject.toml classifiers)
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - run: uv run --project core pytest core/tests -q

  pytest-backend:
    name: pytest (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          # match the Docker base image (ghcr.io/astral-sh/uv:python3.13-*)
          python-version: "3.13"
      - run: uv run --project backend pytest backend/tests -q

  eslint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  build:
    name: tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # Reused by the wrangler job below and by deploy.yml, so production
      # ships the exact bundle CI validated.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          # a green build job with an empty dist must not reach deploy
          if-no-files-found: error

  i18n-keys:
    name: i18n key parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      # uk.json and en.json must keep identical key sets (AGENTS.md)
      - run: node scripts/check_i18n_keys.mjs

  wrangler:
    name: wrangler config + worker typecheck
    runs-on: ubuntu-latest
    needs: build # the assets directory (frontend/dist) must exist
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist
      - run: npm ci
        working-directory: cloudflare
      - run: npm run typecheck
        working-directory: cloudflare
      # Validates wrangler.jsonc and bundles the Worker without Docker,
      # credentials, or uploading anything.
      - run: npm run validate
        working-directory: cloudflare
