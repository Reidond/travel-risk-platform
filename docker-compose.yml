services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      - api-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
