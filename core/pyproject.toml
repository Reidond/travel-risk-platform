[project]
name = "tourism-risk"
version = "0.2.0"
description = "Computational core for tourism travel safety risk assessment (fuzzy multi-level model M_I -> M_R1 -> M_R2 -> M_R3)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrii Shafar", email = "andreyshafar@gmail.com" }]
requires-python = ">=3.12"
dependencies = []
keywords = [
    "tourism",
    "risk-assessment",
    "fuzzy-logic",
    "decision-support",
    "membership-function",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Reidond/travel-risk-platform/tree/main/core"
Repository = "https://github.com/Reidond/travel-risk-platform"
Issues = "https://github.com/Reidond/travel-risk-platform/issues"
Documentation = "https://github.com/Reidond/travel-risk-platform/blob/main/core/README.md"

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.6.0,<1.0.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["CITATION.cff", "tests/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
