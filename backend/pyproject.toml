[project]
name = "travel-risk-api"
version = "0.1.0"
description = "FastAPI backend for the tourism travel safety risk assessment platform"
requires-python = ">=3.12"
dependencies = [
    "tourism-risk",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sqlalchemy>=2",
    "pydantic>=2",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.uv.sources]
tourism-risk = { workspace = true }

[build-system]
requires = ["uv_build>=0.6.0,<1.0.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "RUF001", # Ukrainian texts trip the ambiguous-unicode check
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom uses calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
